name: Release technical alpha

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Build and self-test Windows package
        run: cargo xtask dist --windows-only
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/OpenPremier-${{ needs.validate-tag.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  linux:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build glibc 2.28 AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openpremier-build/target" \
                   "$RUNNER_TEMP/openpremier-build/cargo" \
                   "$RUNNER_TEMP/openpremier-build/rustup"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work/src" \
            -v "$RUNNER_TEMP/openpremier-build/target:/work/target" \
            -v "$RUNNER_TEMP/openpremier-build/cargo:/work/cargo" \
            -v "$RUNNER_TEMP/openpremier-build/rustup:/work/rustup" \
            -e RUST_VERSION=1.98.1 \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash /work/src/packaging/linux/build-in-container.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2
          APPIMAGE_EXTRACT_AND_RUN=1 \
            "dist/OpenPremier-${{ needs.validate-tag.outputs.version }}-x86_64.AppImage" --version
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/OpenPremier-${{ needs.validate-tag.outputs.version }}-x86_64.AppImage
          if-no-files-found: error

  macos:
    needs: validate-tag
    # a macOS problem must not hold back the Windows and Linux packages
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Install FFmpeg and the bundling tool
        run: brew install ffmpeg dylibbundler pkg-config
      - name: Build and self-test the macOS package
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/OpenPremier-${{ needs.validate-tag.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: [validate-tag, windows, linux, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        shell: bash
        run: |
          shopt -s nullglob
          sha256sum *.zip *.AppImage *.dmg > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.AppImage release-assets/*.dmg release-assets/SHA256SUMS.txt)
          notes="docs/releases/${{ needs.validate-tag.outputs.version }}.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenPremier $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --prerelease
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OpenPremier $GITHUB_REF_NAME" \
              --notes-file "$notes" \
              --prerelease
          fi
